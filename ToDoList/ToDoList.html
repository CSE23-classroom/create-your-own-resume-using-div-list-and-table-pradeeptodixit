<!DOCTYPE html>
<html>
<head>
    <title>To Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        input {
            padding: 5px;
            width: 200px;
        }

        button {
            padding: 5px 10px;
            cursor: pointer;
        }

        li {
            margin: 8px 0;
        }
    </style>
</head>

<body>
    <h1>To Do List</h1>

    <input type="text" id="taskInput" placeholder="Enter task">
    <button onclick="addTask()">Add</button>

    <ul id="taskList">
        <li>orange <button onclick="deleteTask(this)">Delete</button></li>
        <li>banana <button onclick="deleteTask(this)">Delete</button></li>
        <li>mango <button onclick="deleteTask(this)">Delete</button></li>
        <li>apple <button onclick="deleteTask(this)">Delete</button></li>
    </ul>

    <script>
        function addTask() {
            let input = document.getElementById("taskInput");
            let task = input.value.trim();

            if (task === "") {
                alert("Please enter a task");
                return;
            }

            let li = document.createElement("li");
            li.innerHTML = `
                ${task}
                <button onclick="deleteTask(this)">
                    Delete
                </button>
            `;
            document.getElementById("taskList").appendChild(li);
            input.value = "";
        }

        function deleteTask(button) {
            button.parentElement.remove();
        }
    </script>
</body>
</html>
